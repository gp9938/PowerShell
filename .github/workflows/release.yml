name: Publish PowerShell Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow whenever a tag starting with 'v' is pushed (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload assets

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Archive PowerShell Scripts
        # This zips your scripts directory (or specific files) into a single archive
        run: |
          zip -r powershell-scripts.zip ./*.ps1

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: PowerShell.zip
